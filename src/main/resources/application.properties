spring.application.name=camel-api-gateway

# Porta do API Gateway
server.port=8081

# Prefixo das URLs expostas pelo Gateway
# camel.rest.context-path=/camel-gateway

# Serviços disponíveis
app.gateway.services.pedidos.base-url=http://localhost:8080
app.gateway.services.pokemons.base-url=https://pokeapi.co/api/v2

logging.level.io.github.resilience4j.circuitbreaker=DEBUG
logging.level.org.apache.camel.component.resilience4j=DEBUG

logging.level.org.springframework.security=DEBUG
